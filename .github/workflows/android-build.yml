name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Memungkinkan build manual dari tab Actions

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_NEXTJS_API_URL=${{ secrets.VITE_SUPABASE_URL }}/functions/v1" >> .env

      - name: Validate Supabase Environment Variables
        run: |
          grep -q '^VITE_SUPABASE_URL=https\?://[^[:space:]]' .env || { echo "❌ ERROR: VITE_SUPABASE_URL is empty or invalid in GitHub Secrets!"; exit 1; }
          grep -q '^VITE_SUPABASE_ANON_KEY=[^[:space:]]\+' .env || { echo "❌ ERROR: VITE_SUPABASE_ANON_KEY is empty in GitHub Secrets!"; exit 1; }
          echo "✅ Environment variables validated successfully."

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Verify Supabase URL in Built Bundle
        run: |
          if ! grep -rq "supabase.co" dist/assets/index-*.js; then
            echo "❌ ERROR: Supabase URL was not baked into dist/assets/index-*.js bundle! Aborting build."
            exit 1
          fi
          echo "✅ Verified: Supabase URL is present in built bundle."

      - name: Sync Capacitor to Android
        run: |
          rm -f dist/update.zip
          npx cap sync android

      - name: Build APK (Release)
        working-directory: ./android
        run: |
          sudo apt-get install -y dos2unix
          dos2unix ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" android/app/build/outputs/apk/release/app-release.apk --title "APK Release $TAG_NAME" --notes "Direct APK download link"
